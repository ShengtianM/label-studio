# 1x3 grid
title_bucket_prefix: &title_bucket_prefix
  - type: text
    name: title
    label: 存储标题
  - type: text
    name: bucket
    label: Bucket名称
    required: true
  - type: text
    name: prefix
    label: Bucket前缀

# 2x3 grid
aws_params_import: &aws_params_import
  - type: text
    name: region_name
    label: 地区名称
    placeholder: us-east-1
  - type: text
    name: s3_endpoint
    label: S3 Endpoint
  - null
  - type: password
    name: aws_access_key_id
    label: Access Key ID
    autoComplete: "off"
    skipAutofill: true
    allowEmpty: false
    protectedValue: true
  - type: password
    name: aws_secret_access_key
    label: Secret Access Key
    autoComplete: "new-password"
    skipAutofill: true
    allowEmpty: false
    protectedValue: true
  - type: password
    name: aws_session_token
    autoComplete: "new-password"
    label: Session Token
    skipAutofill: true
    allowEmpty: true
    protectedValue: true

# 2x3 grid
aws_params_export: &aws_params_export
  - type: text
    name: region_name
    label: 地区名称
    placeholder: us-east-1
  - type: text
    name: s3_endpoint
    label: S3 Endpoint
  - type: text
    name: aws_sse_kms_key_id
    label: SSE KMS Key ID
  - type: password
    name: aws_access_key_id
    label: Access Key ID
    autoComplete: "off"
    skipAutofill: true
    allowEmpty: false
    protectedValue: true
  - type: password
    name: aws_secret_access_key
    label: Secret Access Key
    autoComplete: "new-password"
    skipAutofill: true
    allowEmpty: false
    protectedValue: true
  - type: password
    name: aws_session_token
    autoComplete: "new-password"
    label: Session Token
    skipAutofill: true
    allowEmpty: true
    protectedValue: true


ImportStorage:
  # Title, Bucket, Prefix
  - columnCount: 3
    fields: *title_bucket_prefix
  # Regex filter
  - columnCount: 1
    fields:
      - type: text
        name: regex_filter
        label: 文件过滤正则表达式
        placeholder: '.*csv or .*(jpe?g|png|tiff) or .\w+-\d+.text'
        validators:
          - regexp
  # AWS specific params
  - columnCount: 3
    fields: *aws_params_import

  # 2 columns grid
  - columnCount: 2
    columns:
      - width: 400
        fields:
          - type: toggle
            name: use_blob_urls
            label: 将每个bucket对象视为一个源文件
            description: 如果不勾选此项，则将每个bucket对象视为JSON格式的任务
      - fields:
          - type: toggle
            name: recursive_scan
            label: 递归扫描
            description: 对bucket内容进行递归扫描
      - fields:
          - type: toggle
            name: presign
            label: "使用预签名URL（开启）\n通过Label Studio代理（关闭）"
            description: "当启用预签名URL时，所有数据都会绕过Label Studio，用户浏览器会直接从存储中读取数据"
            value: true
      - fields:
          - type: counter
            name: presign_ttl
            label: 到期分钟数
            min: 1
            value: 15
            dependency: presign

ExportStorage:
  - columnCount: 3
    fields: *title_bucket_prefix
  - columnCount: 3
    fields: *aws_params_export
  # 1 columns grid
  - columnCount: 1
    columns:
      - width: 345
        fields:
          - type: toggle
            name: can_delete_objects
            label: 可以从存储中删除对象
            description: 如果不勾选，则不会从存储中删除注释
